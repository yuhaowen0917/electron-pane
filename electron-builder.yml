appId: com.pane.desktop
productName: Pane
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
  - config.json
extraResources:
  - from: config.json
    to: config.json
asar: true
protocols:
  - name: Pane
    schemes:
      - pane
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Pane
