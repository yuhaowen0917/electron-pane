<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.28" cy="0.16" r="0.85">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#0A0A28" flood-opacity="0.45"/>
    </filter>
    <clipPath id="card"><rect x="250" y="310" width="430" height="360" rx="56"/></clipPath>
  </defs>

  <!-- 背景 squircle -->
  <rect width="1024" height="1024" rx="235" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="235" fill="url(#glow)"/>

  <!-- 层叠玻璃窗格 -->
  <rect x="380" y="180" width="430" height="360" rx="56" fill="#ffffff" opacity="0.21" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <rect x="315" y="245" width="430" height="360" rx="56" fill="#ffffff" opacity="0.41" stroke="#ffffff" stroke-opacity="0.65" stroke-width="4"/>

  <!-- 前层窗口卡片 -->
  <g filter="url(#shadow)">
    <rect x="250" y="310" width="430" height="360" rx="56" fill="#ffffff" opacity="0.96"/>
  </g>
  <g clip-path="url(#card)">
    <rect x="250" y="310" width="430" height="64" fill="#EEF2FF"/>
    <circle cx="296" cy="342" r="13" fill="#FF5F57"/>
    <circle cx="338" cy="342" r="13" fill="#FEBC2E"/>
    <circle cx="380" cy="342" r="13" fill="#28C840"/>
    <rect x="290" y="466" width="180" height="28" rx="14" fill="#6366F1"/>
    <rect x="290" y="522" width="320" height="18" rx="9" fill="#E2E8F0"/>
    <rect x="290" y="558" width="258" height="18" rx="9" fill="#E2E8F0"/>
    <rect x="290" y="594" width="296" height="18" rx="9" fill="#E2E8F0"/>
  </g>
</svg>